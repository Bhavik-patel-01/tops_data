<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="icon" type="image/png" href="favicon.png"> 
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #dc2626;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 25%;
            margin-right: 8px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 75%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }
        .form-group textarea {
            resize: vertical;
        }
        .form-group .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group .checkbox-group label {
            display: flex;
            align-items: center;
        }
        .form-group .checkbox-group input {
            margin-right: 8px;
        }
        .form-group .submit-btn {
            display: flex;
            justify-content: flex-end;
        }
        .form-group .submit-btn button {
            background-color: #10b981;
            color: #ffffff;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Registration Form</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="Enter your first name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Enter your last name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="text" id="mobile" placeholder="Enter your mobile number" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="4" placeholder="Enter your address" required></textarea>
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="Enter your city" required>
            </div>
            <div class="form-group">
                <label for="areaCode">Area PIN</label>
                <input type="text" id="areaCode" placeholder="Enter your area PIN" required>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" placeholder="Enter your state" required>
            </div>
            <div class="form-group">
                <label for="qualification">Qualification</label>
                <select id="qualification" required>
                    <option value="">Select Qualification</option>
                    <option value="undergraduate">Undergraduate</option>
                    <option value="graduate">Graduate</option>
                    <option value="postgraduate">Postgraduate</option>
                </select>
            </div>
            <div class="form-group">
                <label for="specialization">Specialization</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" value="computerScience">
                        Computer Science
                    </label>
                    <label>
                        <input type="checkbox" value="informationTechnology">
                        Information Technology
                    </label>
                    <label>
                        <input type="checkbox" value="computerApplications">
                        Computer Applications
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group submit-btn">
                <button type="submit">Register</button>
            </div>
        </form>
    </div>

    <!-- ✅ JavaScript Validation Added -->
    <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
        let name = document.getElementById("firstName").value;
        let mobile = document.getElementById("mobile").value;

        let nameRegex = /^[A-Za-z]{3,6}$/;  // Name: 3-6 alphabets only
        let mobileRegex = /^[0-9]{10}$/;    // Mobile: Exactly 10 digits no alphabets

        if (!nameRegex.test(name)) {
            alert("First Name must be 3 to 6 alphabets only!");
            event.preventDefault(); // Stop form submission
        }

        if (!mobileRegex.test(mobile)) {
            alert("Mobile must be exactly 10 digits or enter numeric value!");
            event.preventDefault(); // Stop form submission
        }
    });
    </script>
</body>
</html>
